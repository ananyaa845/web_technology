<!--Create a registration form using all available form elements-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=content-width, initial-scale=1.0">
        <title>Form</title>
    </head>
    <body>
        <form action="#" method="post" enctype="multipart/form-data">
            <h1>REGISTRATION FORM</h1>
            <fieldset>
                <legend>Personal Information</legend>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <br>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" required>
                <br>
                <label for="add">Address:</label>
                <input type="text" name="add" id="add" placeholder="Enter your address">
                <br>
                <label for="phoneno">Phone Number:</label>
                <input type="tel" name="phoneno" id="phoneno" placeholder="Enter your phone number">
                <br>
                <label for="gender">Gender:</label><br>
                <label for="male">Male</label>
                <input type="radio" name="gender" id="male" value="male"><br>
                <label for="female">Female</label>
                <input type="radio" name="gender" id="female" value="female"><br>
                <label for="other">Other</label>
                <input type="radio" name="gender" id="other" value="other"><br>
                <label for="country">Country:</label>
                <select name="country" id="country">
                    <option value="india">India</option>
                    <option value="australia">Australia</option>
                    <option value="nepal" selected>Nepal</option>
                    <option value="uk">UK</option>
                    <br>
                </select>
            </fieldset>
            <fieldset>
                <legend>Preferences</legend>
                <label for="game"><strong>Favourite Games:</strong></label><br>
                <label for="football">Football</label>
                <input type="checkbox" name="game" id="football" value="football"><br>
                <label for="cricket">Cricket</label>
                <input type="checkbox" name="game" id="cricket" value="cricket"><br>
                <label for="tennis">Tennis</label>
                <input type="checkbox" id="tennis" name="game" value="tennis"><br>
                <label for="badminton">Badminton</label>
                <input type="checkbox" id="badminton" name="game" value="badminton"><br>
            </fieldset>
            <fieldset>
                <legend>Uploads</legend>
                <label for="profilepic">Upload your profile picture:</label><br>
                <input type="file" id="profilepic" name="profilepic" accept="image/jpeg, image/png"><br><br>
                <label for="certificates">Upload your certificates:</label><br>
                <input type="file" id="certificates" name="certificates" multiple><br>
            </fieldset>
            <br>
            <input type="submit" value="Submit form">
            <input type="reset" value="Clear form">
            
        </form>
    </body>
</html>
