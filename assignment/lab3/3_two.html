<!--Create a html page using using html5 sectioning elements-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sectioning Elements</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my page.</p>
    </header>
    <!-- navigation -->
    <nav>
        <a href="#">Home</a> 
        <a href="#">About</a> 
        <a href="#">Contact</a>
    </nav>

    <section>
        <h2>Main Section</h2>
        <article>
            <h3>Article Title</h3>
            <p>This is an article inside a section.</p>
        </article>
    </section>
    <!-- Section: About -->
    <section id="about">
      <h2>About Me</h2>
      <p>Here is some information about me.</p>
      
      <!-- Article inside a section -->
         <article>
              <h3>My Hobbies</h3>
              <p>I enjoy coding, reading, and drawing.</p>
         </article>
    </section>

    <aside>
        <h3>Side Information</h3>
      <ul>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Projects</a></li>
      </ul>
    </aside>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
