<!-- Implement different branching statements available in js. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
// 1. if statement
let age = 18;
if (age >= 18) {
    console.log("You are eligible to vote.");
}

// 2. if...else statement
let marks = 40;
if (marks >= 50) {
    console.log("You passed!");
} else {
    console.log("You failed!");
}

// 3. if...else if...else statement
let score = 85;
if (score >= 90) {
    console.log("Grade: A");
} else if (score >= 75) {
    console.log("Grade: B");
} else if (score >= 50) {
    console.log("Grade: C");
} else {
    console.log("Grade: F");
}

// 4. switch statement
let day = 3;
switch (day) {
    case 1:
        console.log("Monday");
        break;
    case 2:
        console.log("Tuesday");
        break;
    case 3:
        console.log("Wednesday");
        break;
    default:
        console.log("Other day");
}

// 5. Ternary operator (short form of if...else)
let isMember = true;
let fee = isMember ? "Discounted Fee" : "Regular Fee";
console.log("Membership Fee:", fee);
</script>
</body>
</html>
