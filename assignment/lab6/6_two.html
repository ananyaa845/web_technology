<!-- Create different variables of primitive data type in js. Also provide comments about each data type.-->
<html>
   <head>
      <title>primitive data type</title>
   </head>
<body>
   <script>
// String: Represents textual data
let name = "Ananya";  

// Number: Represents both integer and floating-point numbers
let age = 21;  

// Boolean: Represents logical values true or false
let isStudent = true;  

// Undefined: A variable declared but not assigned a value
let address;  

// Null: Represents an intentional absence of any object value
let middleName = null;  

// Symbol: Represents a unique and immutable identifier
let uniqueId = Symbol("id");  

// BigInt: Represents integers larger than the safe limit for Number
let bigNumber = 1234567890123456789012345678901234567890n; 
   </script> 
</body>
</html>
