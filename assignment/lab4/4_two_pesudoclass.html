<!DOCTYPE html>
<html>
<head>
    <title>Pseudo-class Selectors</title>
    <style>
        /* Hover state */
        a:hover {
            color: red;
        }

        /* Active state (when clicked) */
        a:active {
            color: orange;
        }

        /* Visited link */
        a:visited {
            color: purple;
        }
    </style>
</head>
<body>

    <h1>Pseudo-class Selectors Example</h1>

    <a href="https://example.com">Click or Hover This Link</a>

</body>
</html>
