<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Color Methods</title>
    <style>
        .color-name{
            color:red;
        }
        .hex-color{
            color:#0066ff;
        }
        .rgb-color{
            color:rgb(0,128,0);
        }
        .rgba-color{
            color:rgba(255,0,0,0.6);
        }
        .hsl-color{
            color:hsl(240,100%,50%);
        }
        .hsla-color{
            color:hsla(300,100%,40%,0.7);
        }
        .bg-color{
            background-color:#ffcc00;
            padding:10px;
        }
    </style>
</head>
<body>
    <h2 class="color-name">This text uses color name.</h2>
    <h2 class="hex-color">This text uses hexadecimal color.</h2>
    <h2 class="rgb-color">This text uses rgb color.</h2>
    <h2 class="rgba-color">This text uses rgba color(transparent).</h2>
    <h2 class="hsl-color">This text uses hsl color.</h2>
    <h2 class="hsla-color">This text uses hsla color(transparent).</h2>
    <p class="bg-color">This paragraph uses background color.</p>
</body>
</html>
