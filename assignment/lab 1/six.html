<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Embedding Example</title>
</head>
<body>

    <h2>Audio Example</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mp3"> <!--example only -->
        Browser doesn't support this audio tag.
    </audio>

    <hr>

    <h2>Video Example</h2>
    <video height="400" controls poster="photo/bw.jpg"> <!--example only -->
        <source src="vid.mp4" type="video/mp4">
        Browser doesn't support this video tag.
    </video>

    <hr>

    <h2>YouTube Video (iframe)</h2>
   <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ?si=3oc--y5DNhfubO-B" allowfullscreen></iframe>

</body>
</html>
