<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let students=["shristi", "pratistha", "prasna"];
        console.log(students.length);
        console.log(students);
        students.push("gita");  //insert another element in array
        console.log(students);
        students.pop(); //removes the last element
        console.log(students);
        students.unshift("ram"); //shifts ram to 0 index
        console.log(students);
        let new_array = students.slice(1,3);
        console.log(new_array);
    </script>
</body>
</html>
