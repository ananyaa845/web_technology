<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.js"></script>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <button>Toggle</button><br>
    <div></div>
    <script>
        $("button").on("click",function(){
            $("div").toggle();  
        })
    </script>
</body>
</html>
