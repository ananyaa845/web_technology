<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //creating cookie
        document.cookie=" role=admin; username=Ram; expires=Thu, 18 Dec 2026 12:00:00 UTC;path=/;";

        //reading cookies
        console.log(document.cookie);
        let cookies=document.cookie.split(";");
        console.log(cookies)

        //deleting cookie
        document.cookie=
        "username= Ram ;expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        console.log(document.cookie);
    </script>
</body>
</html>
